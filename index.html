<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ff">
  <title>10 Pravin Payaluga</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <section id="auth-screen" class="card auth-shell" aria-labelledby="auth-title">
    <h1 id="auth-title">🍽 10 Pravin Payaluga</h1>
    <p id="auth-description">Sign in to manage shared food expenses.</p>
    <form id="auth-form">
      <label>Email<input id="auth-email" type="email" autocomplete="email" required></label>
      <label>Password<input id="auth-password" type="password" autocomplete="current-password" minlength="6" required></label>
      <button class="btn" id="auth-submit" type="submit">Sign in</button>
    </form>
    <div class="row">
      <button class="btn s" id="auth-mode" type="button">Create an account</button>
      <button class="btn s" id="google-signin" type="button">Continue with Google</button>
    </div>
    <p class="mu">Accounts are created immediately. The owner must approve and assign each account to an existing member before expenses are visible.</p>
    <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
  </section>

  <div id="app-shell" hidden>
    <header>
      <h1>🍽 10 Pravin Payaluga</h1>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="account-bar"><span id="signed-in-user"></span><button class="btn s" id="signout" type="button">Sign out</button></div>
    </header>
    <main id="app"></main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
